<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPI Fraud Detection - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #312e81, transparent 35%),
                radial-gradient(circle at bottom right, #581c87, transparent 35%),
                #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 40px 35px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);

            backdrop-filter: blur(15px);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #4f46e5
            );
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border-radius: 12px;
            border: 1px solid #334155;

            background: #1e293b;
            color: white;

            outline: none;

            margin-bottom: 20px;

            font-size: 15px;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #4f46e5
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124,58,237,0.35);
        }

        .demo {
            margin-top: 22px;
            padding: 12px;

            background: rgba(124,58,237,0.12);
            border: 1px solid rgba(124,58,237,0.25);

            border-radius: 12px;

            text-align: center;

            color: #c4b5fd;
            font-size: 13px;
        }

        .error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);

            color: #fca5a5;

            padding: 10px;
            border-radius: 10px;

            margin-bottom: 18px;

            text-align: center;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🛡️
        </div>

        <h1>UPI Fraud Detection</h1>

        <p class="subtitle">
            AI + OCR + Image Forensic Analysis
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-btn"
            >
                LOGIN
            </button>

        </form>

        <div class="demo">
            <strong>Demo Login</strong><br>
            Email: admin@frauddetect.com<br>
            Password: admin123
        </div>

        <div class="footer">
            UPI Payment Screenshot Fraud Detection System
        </div>

    </div>

</div>

</body>
</html>
